min_version = "2026.5.2"

[tools]
python = "3.12.13"
uv = "0.11.32"

[tasks.setup]
description = "Install the pinned toolchain and locked workspace dependencies"
run = [
  "mise install",
  'uv sync --all-packages --locked --python "$(mise which python)"',
]

[tasks.validate]
description = "Run all repository checks"
depends = ["lint", "typecheck", "test"]

[tasks.lint]
description = "Run static analysis"
run = "uv run --locked ruff check ."
hide = true

[tasks.typecheck]
description = "Run strict type checking"
run = "uv run --locked pyright"
hide = true

[tasks.test]
description = "Run the test suite"
run = "uv run --locked pytest"
hide = true
