min_version = "2026.5.2"

[tools]
python = "3.12.13"
uv = "0.11.32"

[tasks.setup]
description = "Install the pinned toolchain and locked workspace dependencies"
run = [
  "mise install",
  'uv sync --all-packages --locked --python "$(mise which python)"',
]

[tasks.validate]
description = "Run all repository checks"
depends = ["lint", "typecheck", "test"]

[tasks.lint]
description = "Run static analysis"
run = "uv run --locked ruff check ."
hide = true

[tasks.typecheck]
description = "Run strict type checking"
run = "uv run --locked pyright"
hide = true

[tasks.test]
description = "Run the test suite"
run = "uv run --locked pytest"
hide = true

[tasks.prototype-tool-after-filter]
description = "Run the throwaway tool.after filtering model"
run = "uv run --locked python packages/hook-bridge-sdk/prototypes/tool_after_filter_model.py"

[tasks.prototype-tool-after-payload]
description = "Compare throwaway tool.after terminal-payload models"
run = "uv run --locked python packages/hook-bridge-sdk/prototypes/tool_after_payload_model.py"
