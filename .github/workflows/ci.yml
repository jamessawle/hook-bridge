name: CI

on:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Validate
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up development tools
        uses: jdx/mise-action@v3
        with:
          cache: true

      - name: Set up repository
        run: mise run setup

      - name: Validate
        run: mise run validate
